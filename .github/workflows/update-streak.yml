name: Update contribution streak card

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate streak card
        run: python3 .github/scripts/gen_streak_svg.py contribution-streak.svg
      - name: Commit if changed
        run: |
          if git diff --quiet -- contribution-streak.svg; then
            echo "Card is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contribution-streak.svg
            git commit -m "chore: refresh contribution streak card"
            git push
          fi
